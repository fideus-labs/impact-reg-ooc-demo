[workspace]
name = "impact-reg-ooc-demo"
description = "Out-of-core multimodal registration with KonfAI and IMPACT: the competition pair, end to end"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Two environments, because the backends disagree on torch: ITKIMPACT (ConvexAdam) pins torch 2.12, while the
# elastix-IMPACT binary is built against LibTorch 2.8. `default` runs FireANTs and ConvexAdam, `elastix` runs elastix;
# the pipeline scripts and ngff-zarr are in both. Every torch is a CUDA 12 build: the elastix binary needs
# libcudart.so.12 beside the LibTorch it links, and PyPI's own torch 2.12 is a CUDA 13 build.

[dependencies]
python = "3.12.*"

[pypi-dependencies]
impact-reg-konfai = "*"
konfai = { version = "*", extras = ["omezarr", "monitoring"] }
fireants = "*"
ngff-zarr = { version = "*", extras = ["cli"] }
simpleitk = ">=2.4"
scipy = "*"
h5py = "*"
# zarr over HTTPS, for the stores on the bucket (README)
fsspec = "*"
aiohttp = "*"

[pypi-options.dependency-overrides]
# fireants pins simpleitk==2.2.1, which has no wheel for this Python; the stack's SimpleITK serves it.
simpleitk = ">=2.4"

[feature.torch212.pypi-dependencies]
# itk-impact 0.1.3 renamed itk.ModelConfiguration to itk.ImpactModelConfiguration; impact-reg-konfai 1.8.5 uses the old name.
itk-impact = "==0.1.2"
torch = { version = "==2.12.*", index = "https://download.pytorch.org/whl/cu129" }

[feature.elastix.pypi-dependencies]
torch = { version = "==2.8.*", index = "https://download.pytorch.org/whl/cu128" }

[feature.elastix.target.unix.activation.env]
# libcudart.so.12 comes with the nvidia-cuda-runtime-cu12 wheel, outside torch's own lib/; impact-reg-konfai adds this
# directory to the elastix binary's loader path.
KONFAI_ELASTIX_EXTRA_LIB = "$CONDA_PREFIX/lib/python3.12/site-packages/nvidia/cuda_runtime/lib"

[environments]
default = ["torch212"]
elastix = ["elastix"]
upload = { features = ["upload"], no-default-feature = true }
fsleyes = { features = ["fsleyes"], no-default-feature = true }

[tasks.convert]
cmd = "bash pipeline/convert.sh"
description = "Every NIfTI under data/input/<subject>/ as an OME-Zarr store under data/ome-zarr/<subject>/ (ngff-zarr CLI)"
inputs = ["data/input/*/*.nii.gz", "pipeline/convert.sh"]
outputs = ["data/ome-zarr/*/*.ome.zarr/zarr.json"]

[tasks.prepare]
cmd = "python pipeline/prepare_pair.py {{ subject }}"
args = [{ arg = "subject", default = "subject_v" }]
depends-on = ["convert"]
description = "Stage 1 (orientation, affine) and the 0.4 mm pair of one subject as OME-Zarr stores under out/<subject>/pair/"

[tasks.register]
# The presets are this repository's own (presets/, every setting in the files); the feature models and the elastix
# binary are still fetched on first use. KONFAI_IMPACTREG_REPO replaces the Hugging Face repository presets come from,
# so it is set here rather than for the whole workspace.
# The preset writes its displacement field as an ITK transform file (Transform.h5) and impact-reg-konfai the moved
# image as OME-Zarr; the second command writes the field as Transform.ome.zarr beside it, NGFF 0.6rc0 with the
# OME-Zarr RFC-5 `displacements` transformation.
cmd = """impact-reg-konfai register {{ preset }} \
  -f out/{{ subject }}/pair/Fixed.ome.zarr -m out/{{ subject }}/pair/Moving.ome.zarr \
  --fixed-mask out/{{ subject }}/pair/FixedMask.ome.zarr --moving-mask out/{{ subject }}/pair/MovingMask.ome.zarr \
  -o out/{{ subject }}/{{ preset }} {{ device }} \
  && python pipeline/transform_to_ome_zarr.py out/{{ subject }}/{{ preset }}/P000/Transform.h5 out/{{ subject }}/pair/Fixed.ome.zarr"""
args = [
  { arg = "preset", default = "APEX_FIREANTS_SYN_CC" },
  { arg = "subject", default = "subject_v" },
  { arg = "device", default = "--gpu 0" },
]
env = { KONFAI_IMPACTREG_REPO = "$PIXI_PROJECT_ROOT/presets" }
depends-on = [{ task = "prepare", args = ["{{ subject }}"] }]
description = "One preset on one subject's pair: pixi run register <preset> <subject> [<device>], e.g. register APEX_FIREANTS_SYN_CC subject_m '--cpu 8' (an elastix preset needs the elastix environment: pixi run -e elastix register ...)"

[tasks.register-fireants]
depends-on = [{ task = "register", args = ["APEX_FIREANTS_SYN_CC", "{{ subject }}", "{{ device }}"] }]
args = [{ arg = "subject", default = "subject_v" }, { arg = "device", default = "--gpu 0" }]
description = "FireANTs: symmetric diffeomorphic SyN on the GPU"

[tasks.register-impact]
depends-on = [{ task = "register", args = ["APEX_FIREANTS_TS", "{{ subject }}", "{{ device }}"] }]
args = [{ arg = "subject", default = "subject_v" }, { arg = "device", default = "--gpu 0" }]
description = "FireANTs SyN with the IMPACT loss: TotalSegmentator features instead of intensities"

[tasks.register-convexadam]
depends-on = [{ task = "register", args = ["APEX_CONVEXADAM_MIND", "{{ subject }}", "{{ device }}"] }]
args = [{ arg = "subject", default = "subject_v" }, { arg = "device", default = "--gpu 0" }]
description = "ConvexAdam on MIND features"

[tasks.register-elastix]
# The same `register`, in the elastix environment (its torch 2.8 is the LibTorch the elastix binary links).
cmd = "pixi run -e elastix register APEX_FA_RET_BSPLINE {{ subject }} '{{ device }}'"
args = [{ arg = "subject", default = "subject_v" }, { arg = "device", default = "--gpu 0" }]
description = "elastix: B-spline, Mattes mutual information + bending energy (in the elastix environment)"

[tasks.register-all]
depends-on = [
  { task = "register-elastix", args = ["subject_v"] },
  { task = "register", args = ["APEX_FIREANTS_SYN_CC", "subject_v"] },
  { task = "register", args = ["APEX_FIREANTS_TS", "subject_v"] },
  { task = "register", args = ["APEX_CONVEXADAM_MIND", "subject_v"] },
  { task = "register-elastix", args = ["subject_m"] },
  { task = "register", args = ["APEX_FIREANTS_SYN_CC", "subject_m"] },
  { task = "register", args = ["APEX_FIREANTS_TS", "subject_m"] },
  { task = "register", args = ["APEX_CONVEXADAM_MIND", "subject_m"] },
]
description = "Every engine and loss of the published table, on both subjects, on GPU 0"

[tasks.score]
cmd = "python pipeline/score_pair.py {{ subject }}"
args = [{ arg = "subject", default = "subject_v" }]
description = "Every run of one subject on its pair grid: tissue Dice, mutual information, residual shift by MI and by gradients, folding and the field's size"

[tasks.nifti]
# The competition's result files of one run, in the organisers' layout under competition/ (their Competition_Results,
# this repository as Team C): Team_C_method_<n>/Subject_<X>/{DMRI_to_PSOCT,PSOCT_to_DMRI}.nii.gz on the inputs' own
# grids and headers, beside Data/Subject_<X>/{PSOCT,DMRI}.nii.gz linked from data/input/. The method number is the
# preset's row in the README's table.
cmd = "python pipeline/competition_results.py {{ preset }} {{ subject }}"
args = [{ arg = "preset", default = "APEX_FIREANTS_SYN_CC" }, { arg = "subject", default = "subject_v" }]
description = "One run as the competition's NIfTI pair, in the organisers' Team_C layout under competition/: pixi run nifti <preset> <subject> (after pixi run register <preset> <subject>)"

[tasks.nifti-all]
depends-on = [
  { task = "nifti", args = ["APEX_FA_RET_BSPLINE", "subject_v"] },
  { task = "nifti", args = ["APEX_FIREANTS_SYN_CC", "subject_v"] },
  { task = "nifti", args = ["APEX_FIREANTS_TS", "subject_v"] },
  { task = "nifti", args = ["APEX_CONVEXADAM_MIND", "subject_v"] },
  { task = "nifti", args = ["APEX_FA_RET_BSPLINE", "subject_m"] },
  { task = "nifti", args = ["APEX_FIREANTS_SYN_CC", "subject_m"] },
  { task = "nifti", args = ["APEX_FIREANTS_TS", "subject_m"] },
  { task = "nifti", args = ["APEX_CONVEXADAM_MIND", "subject_m"] },
]
description = "Every preset of the table on both subjects as the competition's NIfTI pairs: Team_C_method_1 to 4 under competition/"

[feature.upload.dependencies]
# The upload environment is s5cmd alone: no torch, no Python.
s5cmd = "*"

[feature.upload.tasks.upload]
cmd = "bash pipeline/upload.sh"
description = "Every OME-Zarr store of the pair (inputs, pair, moved FA and field of each preset in the table) to the public Filebase bucket, under its key in this tree: pixi run upload [--dry-run] [<subject> ...], with FILEBASE_KEY and FILEBASE_SECRET set"

[feature.fsleyes.dependencies]
# The viewer the competition's instructions use, in an environment of its own (wxPython and OpenGL, no torch).
fsleyes = "*"

[feature.fsleyes.tasks.view]
# The organisers' own fsleyes commands, from their document, run from competition/: the carried image over the
# subject's input, both in greyscale or the carried tissue as a red outline, with their display ranges per subject.
cmd = "bash pipeline/view.sh {{ view }} {{ style }} {{ subject }} {{ method }}"
args = [
  { arg = "view", default = "dmri-in-psoct" },
  { arg = "style", default = "outline" },
  { arg = "subject", default = "V" },
  { arg = "method", default = "2" },
]
description = "fsleyes on one method and subject as the organisers view them: pixi run view <psoct-in-dmri|dmri-in-psoct> <grey|outline> <M|V> <method>"

[feature.fsleyes.tasks.render]
cmd = "bash pipeline/view.sh --png {{ view }} {{ style }} {{ subject }} {{ method }}"
args = [
  { arg = "view", default = "dmri-in-psoct" },
  { arg = "style", default = "outline" },
  { arg = "subject", default = "V" },
  { arg = "method", default = "2" },
]
description = "The same view as a PNG under competition/renders/, without a window (fsleyes render; xvfb-run pixi run render ... on a machine with no display)"
