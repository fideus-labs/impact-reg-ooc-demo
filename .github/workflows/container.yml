# Builds the brainlife.io App's container (./Dockerfile) and publishes it to GitHub's registry as
# ghcr.io/fideus-labs/impact-reg-ooc-demo:<tag>. `main` in this repository pins the tag it runs; bump it
# there when a release changes the stack. Runs on a version tag, on demand, and on pull requests that touch
# the stack (build only, no push).
name: container

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", "pixi.toml", "pixi.lock", ".github/workflows/container.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (for example 1.0.0 or dev)"
        required: true
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Two torch stacks with their CUDA runtimes run to ~20 GB unpacked: the hosted runner needs the room.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      tag: ${{ steps.meta.outputs.tags }}

  # brainlife runs the image through singularity, which cannot read a manifest list or a foreign layer type,
  # and the compute node does the conversion without internet access. Check it converts and that both
  # environments start; a fresh runner, since the build fills the first one's disk.
  singularity:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      - name: Install apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apptainer
      - name: Pull and smoke-test
        run: |
          tag="$(echo '${{ needs.image.outputs.tag }}' | head -n1)"
          apptainer pull --disable-cache /tmp/app.sif "docker://$tag"
          apptainer exec /tmp/app.sif bash /opt/impact-reg-ooc-demo/env/default.sh impact-reg-konfai --help
          apptainer exec /tmp/app.sif bash /opt/impact-reg-ooc-demo/env/default.sh python -c "import torch, konfai, impact_reg_konfai, ngff_zarr; print('default: torch', torch.__version__)"
          apptainer exec /tmp/app.sif bash /opt/impact-reg-ooc-demo/env/elastix.sh python -c "import torch, impact_reg_konfai; print('elastix: torch', torch.__version__)"
          apptainer exec /tmp/app.sif ls /opt/elastix-impact/bin /opt/impact-reg-ooc-demo/hf-cache/hub
